# NON-AUTHORITATIVE REFERENCE SNAPSHOT.
# The deployed nginx vhost is Ansible-managed; the source of truth is
# roles/server/templates/nginx/conf.d/busradar.pihaar.de.conf.j2 in the
# machine-config repo. This copy exists so readers self-hosting Busradar BW
# have the reverse-proxy config in-repo; re-sync it when the template changes.
# busradar.pihaar.de — Busradar BW reverse proxy (Unix socket)

upstream busradar_backend {
    server unix:/run/busradar/uvicorn.sock;
}

map $uri $busradar_cache {
    default                                "public, max-age=2592000";
    ~^/$                                   "no-cache";
    ~^/index\.html$                        "no-cache";
    ~^/manifest\.webmanifest$              "no-cache";
    ~^/sw\.js$                             "no-cache, no-store, must-revalidate";
    # Top-level app JS/CSS (/init.js, /map.js, /style.css, ...) change every
    # deploy but their module-import URLs carry no version query. Revalidate
    # (304 when unchanged, fresh after a deploy) so browsers WITHOUT a service
    # worker pick up deploys without a manual cache clear. Immutable assets
    # under /vendor/, /fonts/, /icons/ keep the long max-age (no slash-free
    # top-level match). Listed after /sw.js so that stays no-store.
    ~^/[^/]+\.(js|css)$                    "no-cache";
    ~^/api/                                "no-store";
}

server {
    listen 443 quic;
    listen 443 ssl;
    listen [::]:443 quic;
    listen [::]:443 ssl;
    http2 on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    ssl_certificate     /etc/nginx/certs/live/pihaar.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/pihaar.de/privkey.pem;

    server_name busradar.pihaar.de;

    # Edge security headers on EVERY response, including nginx-generated ones
    # (error pages, the :80 redirect) that never reach the app. The app also
    # sets XCTO / XFO / Referrer-Policy (so it self-protects if ever run without
    # nginx); proxy_hide_header strips the app's copy from the upstream response
    # so the wire carries exactly ONE of each. A duplicate like
    # "X-Frame-Options: DENY, DENY" is malformed and some browsers ignore it.
    # Service-Worker-Allowed is single-owner the other way (app only, see
    # location = /sw.js) since its combined "/, /" breaks Firefox SW registration.
    # CSP + Permissions-Policy stay app-only (CSP carries the inline-script hash).
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control $busradar_cache always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # Service Worker
    location = /sw.js {
        proxy_pass http://busradar_backend;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Service-Worker-Allowed is emitted by the app (TemplatedAsset). Do NOT
        # add it here too: two identical headers get combined into "/, /", which
        # Firefox/Gecko parses as an invalid scope URI and rejects registration
        # with "SecurityError: The operation is insecure". Chromium tolerates the
        # duplicate, which is why the breakage was Firefox-only.
    }

    # SSE stream endpoint — long-lived connection, no buffering, no cache,
    # generous read timeout (2h matches the cookie max_age). JID/LID values
    # appear in the response body; nginx access_log only logs the request
    # line and standard fields, so they don't escape into logs by default.
    location = /api/stream/ {
        proxy_pass http://busradar_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering "no" always;
        # Per-IP concurrent-connection slowloris defense. App-level cap is
        # MAX_SUBSCRIBERS_PER_IP=20 (in fanout.py); nginx limit is set
        # slightly higher so the App-cap delivers the informative 429 body
        # before nginx returns a generic 503.
        limit_conn sse_ip 25;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # SSE sidecar POST endpoints — small bodies (<1 KB), normal proxy semantics.
    location ~ ^/api/stream/(viewport|select)$ {
        proxy_pass http://busradar_backend;
        limit_req zone=busradar_api burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # API (Rate-Limited)
    location /api/ {
        proxy_pass http://busradar_backend;
        limit_req zone=busradar_api burst=20 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # Default (alle anderen Pfade — erbt server-level add_header)
    location / {
        proxy_pass http://busradar_backend;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name busradar.pihaar.de;
    return 301 https://busradar.pihaar.de$request_uri;
}
